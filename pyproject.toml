[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnscope"
dynamic = ["version"]
description = "Timing of a two-channel call recording: agent response delay, interruptions, barge-ins, dead air."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
maintainers = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
dependencies = ["numpy>=1.23", "soundfile>=0.12"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Topic :: Multimedia :: Sound/Audio :: Analysis"]

[project.urls]
Homepage = "https://github.com/BoobalanArjunan/Turnscope"
Issues = "https://github.com/BoobalanArjunan/Turnscope/issues"
Source = "https://github.com/BoobalanArjunan/Turnscope"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
turnscope = "turnscope.cli:main"

[tool.setuptools.dynamic]
version = { attr = "turnscope._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
